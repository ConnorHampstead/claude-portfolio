name = "daytrade-dispatch"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[triggers]
# Cron here is UTC-only, so each job is listed at both its summer (EDT) and
# winter (EST) hour; src/index.ts dispatches only on the one that matches New
# York time. Three expressions, inside the free plan's 5 per account.
#
# Weekdays by name only. Cloudflare numbers them 1 = Sunday .. 7 = Saturday,
# unlike standard cron, so "1-5" is Sunday-Thursday - which is how the Friday
# session went missing and the Friday cleanup ran on Thursday (2026-09-24/25).
crons = ["55 12,13 * * MON-FRI", "55 13,14 * * MON-FRI", "50 17,18 * * FRI"]

[observability]
enabled = true
