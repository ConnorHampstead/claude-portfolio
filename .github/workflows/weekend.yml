name: weekend cleanup

# Cancels every unfilled entry order before the weekend.
#
# This is a different policy from the daily session, which only cancels entries
# older than the 5-day holding horizon. The reasoning here is specific to the
# weekend gap: a limit order left resting from Friday can fill on Monday's open
# into a thesis written before two days of news it never saw. The entry price
# would be honoured; the reasoning behind it would not be.
#
# If you would rather let entries survive the weekend, delete this file — the
# daily age-based cleanup in session.sh is independent of it.

on:
  # No `schedule` trigger - GitHub's cron fired hours late, after the close.
  # dispatch/ calls workflow_dispatch with dry_run=false instead: a Cloudflare
  # Worker cron at 13:50 ET Friday (primary) and a systemd timer at 14:50 ET
  # (backup, exits on the already-ran check below).
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be cancelled without cancelling it'
        type: boolean
        default: true

concurrency:
  group: trading-desk        # never overlap the daily session
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Must cover the hold plus the cleanup. The 13:50 ET dispatch holds 2h.
    timeout-minutes: 150

    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

    steps:
      # Branch tip, not the frozen triggering SHA - see desk.yml for why.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # The first line of the committed log is the marker. Dry runs never commit,
      # so they never mask a missed cleanup.
      - name: Already ran today?
        id: ran
        run: |
          if [ "$(head -n1 state/weekend-cleanup.txt 2>/dev/null)" = "run $(date -u +%Y-%m-%d)" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Cleanup already ran today - nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.ran.outputs.already == 'false'
        with:
          python-version: '3.12'

      # No Claude call and no chart, so requests alone is enough.
      - name: Install dependencies
        if: steps.ran.outputs.already == 'false'
        run: pip install requests

      # Killswitch before the wait, so a non-trading day exits in seconds
      # instead of holding a runner open for nothing.
      - name: Is today a trading day?
        id: guard
        if: steps.ran.outputs.already == 'false'
        run: |
          if python3 desk.py calendar; then
            echo "trading=true" >> "$GITHUB_OUTPUT"
          else
            echo "trading=false" >> "$GITHUB_OUTPUT"
          fi

      # Hold until 10 minutes before the close, so the cancellations land just
      # ahead of the bell rather than whenever the scheduler fired.
      #
      # Derived from Alpaca's calendar rather than a wall clock, which matters
      # twice a year: the close is 20:00 UTC in summer and 21:00 in winter,
      # and on the half-day session after Thanksgiving - always a Friday, so
      # always this workflow - it is 18:00 UTC. A fixed target would sleep
      # straight past that early close.
      - name: Hold open until 10 min before the close
        if: steps.guard.outputs.trading == 'true'
        run: python3 desk.py wait --before-close 10

      - name: Cancel resting entries
        if: steps.guard.outputs.trading == 'true'
        run: |
          mkdir -p state
          echo "run $(date -u +%Y-%m-%d)" > state/weekend-cleanup.txt
          if [ -n "${DRY_RUN}" ]; then
            echo "*** DRY RUN - listing only ***"
            python3 desk.py stale | tee -a state/weekend-cleanup.txt
          else
            # No --older-than: everything unfilled goes, whatever its age.
            python3 desk.py stale --confirm | tee -a state/weekend-cleanup.txt
            # Mark the cancelled rows so they don't linger in the journal
            # looking like open trades.
            python3 desk.py reconcile | tee -a state/weekend-cleanup.txt
          fi
          python3 desk.py status | tee -a state/weekend-cleanup.txt

      - name: Commit results
        if: steps.guard.outputs.trading == 'true' && !inputs.dry_run
        run: |
          git config user.name  "trading-desk[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state journal.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "weekend cleanup $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          {
            echo "## Weekend cleanup $(date -u +%Y-%m-%d)"
            if [ "${{ steps.ran.outputs.already }}" = "true" ]; then
              echo "Already ran today — duplicate trigger exited without acting."
            elif [ "${{ steps.guard.outputs.trading }}" != "true" ]; then
              echo "US market closed today — nothing to do."
            else
              echo '```'
              cat state/weekend-cleanup.txt 2>/dev/null || echo "(none)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"