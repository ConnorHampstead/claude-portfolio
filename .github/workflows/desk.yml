name: trading desk

on:
  # No `schedule` trigger. GitHub's cron fired 4-6 hours late on this repo, every
  # day, which put every scheduled run past the open. The clock now lives in
  # dispatch/ - a Cloudflare Worker cron (primary: 08:55 ET pre-market, 09:55
  # ET open) and a systemd timer (backup: 09:00 and 10:00 ET) - both of which
  # call workflow_dispatch below with dry_run=false. Dispatch events start in
  # seconds. The backup queues behind the concurrency group and exits on the
  # already-ran check.
  #
  # Two sessions a day run through this one workflow: the pre-market brief
  # (09:05 ET) and the post-open review (10:05 ET), chosen by `session`.
  workflow_dispatch:        # the dispatchers, or by hand from the Actions tab
    inputs:
      dry_run:
        description: 'Dry run: generate and validate the brief, submit nothing'
        type: boolean
        default: true
      session:
        description: 'pre-market (brief before the open) or open (review after it)'
        type: choice
        options: [pre-market, open]
        default: pre-market

# Only one session at a time. A delayed run must never overlap the next.
concurrency:
  group: trading-desk
  cancel-in-progress: false

permissions:
  contents: write           # to commit the brief and journal back

jobs:
  session:
    runs-on: ubuntu-latest
    # Must cover the hold plus the session. The 08:55 ET dispatch holds 10 min
    # and the session runs ~20 min; the headroom is for a manual dispatch
    # started early, which would otherwise time out in the wait step waiting
    # for the same 09:05 ET target (anything before ~06:30 ET still will).
    timeout-minutes: 165

    # Secrets are scoped per step, not set here, so the install steps and
    # third-party actions never see them.
    env:
      # The dispatchers pass dry_run=false explicitly; by hand it defaults to true.
      # Compared against both forms on purpose: a boolean input arrives as a real
      # boolean from the Actions tab, but as the STRING "false" from the dispatch
      # API (the Worker and `gh workflow run -f`). A bare `inputs.dry_run` is
      # truthy for that string, which silently made every dispatched run a dry run.
      DRY_RUN: ${{ (inputs.dry_run == true || inputs.dry_run == 'true') && '1' || '' }}
      SESSION: ${{ inputs.session || 'pre-market' }}
      # Pinned, not the `opus` alias: a model change is a change to the
      # experiment. Preflight uses it too, so a model the CLI cannot serve
      # fails there, before any session work.
      DESK_MODEL: claude-opus-5-5

    steps:
      # ref is set explicitly on purpose. With no ref, checkout takes the SHA
      # that *triggered* the workflow, frozen when the event is created. The
      # backup dispatch queues behind the primary for ~80 min, so that stale
      # tree would not contain the completion marker the primary pushed in the
      # meantime, and the session would be submitted twice. Taking the branch
      # tip closes that window.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ github.ref_name }}

      # The completion marker is briefs/<date>.submit.txt (pre-market) or
      # briefs/<date>-open.submit.txt (open), written only after a real submit.
      # Dry runs don't create it, so they never mask a missed session. To force
      # a re-run, delete that file.
      - name: Already ran today?
        id: ran
        run: |
          D=$(date -u +%Y-%m-%d)
          SFX=""; [ "$SESSION" = open ] && SFX="-open"
          if [ -f "briefs/${D}${SFX}.submit.txt" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "${SESSION} session for ${D} already completed - nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "No completed ${SESSION} session for ${D} yet - proceeding."
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: steps.ran.outputs.already == 'false'
        with:
          python-version: '3.12'

      # Just enough to run desk.py's guard checks below. The rest of
      # requirements.txt (matplotlib etc.) and the npm install are deferred
      # past the guard so a dead trigger (holiday, already ran) never pays
      # for them.
      - name: Install minimal dependencies for guard checks
        if: steps.ran.outputs.already == 'false'
        run: pip install --require-hashes -r requirements-min.txt

      # Cheap killswitch, deliberately WITHOUT --before-open. Its only job is
      # to stop a holiday or weekend trigger from holding a runner open for
      # hours and installing a toolchain it will never use. The pre-open
      # deadline is a separate question and cannot be answered here - this
      # runs before the hold, so any answer it gave would be stale by the time
      # it mattered.
      - name: Is today a trading day?
        id: tradingday
        if: steps.ran.outputs.already == 'false'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          if python3 desk.py calendar; then
            echo "trading=true" >> "$GITHUB_OUTPUT"
          else
            echo "trading=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.tradingday.outputs.trading == 'true'
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.tradingday.outputs.trading == 'true'
        run: |
          pip install --require-hashes -r requirements.txt
          npm install -g @anthropic-ai/claude-code@2.1.278
          claude --version

      # Lands the session at a consistent point relative to the market rather
      # than whenever the job happened to start. With the Cloudflare dispatch
      # this is a 10 min wait, or 5 min if the systemd backup is the one doing
      # it.
      #
      # 25 minutes before the open, not a fixed wall clock: the open is
      # 13:30 UTC in summer and 14:30 in winter, and is earlier still on
      # half-day sessions. Deriving it from Alpaca's calendar keeps this
      # correct across both daylight-saving regimes without a table of dates.
      # 25 min is chosen so the ~20 min session finishes just before the bell.
      # A trigger that starts later than the target skips the wait entirely.
      #
      # The post-open review holds until 35 min after the open instead: late
      # enough that the 10:00 ET releases have printed and the opening range
      # has formed.
      - name: Hold until the session's target time
        if: steps.tradingday.outputs.trading == 'true'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          if [ "$SESSION" = open ]; then
            python3 desk.py wait --after-open 35
          else
            python3 desk.py wait --before-open 25
          fi

      # The real deadline check, now that we are about to do the work. This is
      # what stops a badly delayed run writing a "pre-market" brief with the
      # market already trading. It has to be here, after the wait, because
      # that is the only point where "how long until the open" is the number
      # that actually governs the session.
      #
      # The post-open review has its own window, 30-120 min after the open: a
      # review written at noon is not the same session as one written at 10:05.
      - name: Still inside the session's window?
        id: guard
        if: steps.tradingday.outputs.trading == 'true'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
        run: |
          if [ "$SESSION" = open ]; then
            WINDOW="--open-window 30 120"
          else
            WINDOW="--before-open 5"
          fi
          if python3 desk.py calendar $WINDOW; then
            echo "trading=true" >> "$GITHUB_OUTPUT"
          else
            echo "trading=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight — auth
        if: steps.guard.outputs.trading == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Optional. If set, it takes precedence over the OAuth token above.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          echo "claude version: $(claude --version 2>&1 || echo 'NOT INSTALLED')"

          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN: set, ${#CLAUDE_CODE_OAUTH_TOKEN} chars"
            case "$CLAUDE_CODE_OAUTH_TOKEN" in
              sk-ant-oat*)
                echo "  prefix ok (sk-ant-oat...)" ;;
              sk-ant-api*)
                echo "  WRONG VALUE: that is an API key, not an OAuth token."
                echo "  Put it in the ANTHROPIC_API_KEY secret instead." ;;
              *)
                echo "  WRONG PREFIX: expected sk-ant-oat..., got something else."
                echo "  Re-run 'claude setup-token' and copy only the token line." ;;
            esac
            if printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | grep -q '[[:space:]]'; then
              echo "  WARNING: contains whitespace/newline — copy-paste artifact."
            fi
          else
            echo "CLAUDE_CODE_OAUTH_TOKEN: not set"
          fi

          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "ANTHROPIC_API_KEY: set, ${#ANTHROPIC_API_KEY} chars (takes precedence)"
          else
            echo "ANTHROPIC_API_KEY: not set"
          fi

          echo "--- live auth test (1 turn, negligible cost) ---"
          claude -p "Reply with exactly: PREFLIGHT_OK" \
            --model "$DESK_MODEL" --max-turns 1 --output-format text

      - name: Run session
        id: session
        if: steps.guard.outputs.trading == 'true'
        env:
          ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
          ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: bash scripts/session.sh

      # Runs even when the session step failed. `desk.py submit` exits non-zero
      # when an order did not reach Alpaca, and that is exactly the run whose
      # brief, journal and status you most need committed - the record of what
      # was attempted is what tells you what to repair by hand.
      - name: Commit results
        if: ${{ !cancelled() && steps.ran.outputs.already == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "trading-desk[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A briefs state journal.csv shadow.csv README.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            if [ "$SESSION" = open ]; then MSG="open session"; else MSG="session"; fi
            git commit -m "${MSG} $(date -u +%Y-%m-%d)"
            # A delayed run may be behind if you pushed meanwhile.
            # checkout runs with persist-credentials: false, so the token is
            # passed here only, never left in .git/config for earlier steps.
            AUTH="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
            git -c http.https://github.com/.extraheader="$AUTH" pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git -c http.https://github.com/.extraheader="$AUTH" push
          fi

      - name: Session summary
        if: always()
        run: |
          {
            echo "## ${SESSION} session $(date -u +%Y-%m-%d)"
            if [ "${{ steps.ran.outputs.already }}" = "true" ]; then
              echo "Already completed earlier today — duplicate trigger exited without acting."
            elif [ "${{ steps.tradingday.outputs.trading }}" != "true" ]; then
              echo "US market closed - stood down."
            elif [ "${{ steps.guard.outputs.trading }}" != "true" ]; then
              echo "Outside the ${SESSION} session's window - stood down rather than"
              echo "write a brief that would not be comparable with the record."
            else
              if [ "${{ steps.session.outcome }}" = "failure" ]; then
                echo "> **Not every order reached Alpaca.** The book does not"
                echo "> match the brief - see the Submit group in the log and"
                echo "> check the book state below before the open."
                echo
              fi
              echo "### Validation"
              echo '```'
              D=$(date -u +%Y-%m-%d)
              SFX=""; [ "$SESSION" = open ] && SFX="-open"
              cat "state/dryrun/${D}${SFX}.check.txt" "briefs/${D}${SFX}.check.txt" 2>/dev/null \
                || echo "(none)"
              echo '```'
              echo "### Book"
              echo '```'
              cat state/status.txt 2>/dev/null || echo "(none)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
