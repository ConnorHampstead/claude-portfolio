name: trading desk

on:
  schedule:
    # NOT on the hour. GitHub's docs are explicit that the start of every hour is
    # a high-load window and that queued scheduled jobs may be dropped entirely,
    # not merely delayed - which surfaces as total silence, since the trigger
    # never fires and there is no run to fail.
    #
    # Three triggers, hourly, all converging on the same target: 25 minutes
    # before the actual open (see "Hold open" below). These solve two
    # different problems and it is worth keeping them straight.
    #
    #   Delay   - a trigger fires late. Solved by the job holding itself open
    #             and waiting out the gap, not by the schedule.
    #   Dropped - a trigger never fires at all, so there is no job to wait.
    #             Only a later trigger can cover that, hence three.
    #
    # Whichever fires first does the work and holds the runner until the
    # target; the others queue behind the concurrency group below and exit in
    # seconds on the already-ran check. Earliest is 10:12 so the longest hold
    # is ~3h, well inside the 6h ceiling GitHub puts on a single job.
    - cron: '12 10 * * 1-5'
    - cron: '12 11 * * 1-5'
    - cron: '12 12 * * 1-5'
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab
    inputs:
      dry_run:
        description: 'Dry run: generate and validate the brief, submit nothing'
        type: boolean
        default: true

# Only one session at a time. A delayed run must never overlap the next.
concurrency:
  group: trading-desk
  cancel-in-progress: false

permissions:
  contents: write           # to commit the brief and journal back

jobs:
  session:
    runs-on: ubuntu-latest
    # Must cover the longest possible hold plus the session itself. The 10:12
    # trigger firing on time waits ~3h for a 13:05 UTC target (summer), then
    # runs for ~20 min. GitHub kills any single job at 6h regardless, so this
    # sits just under that.
    timeout-minutes: 330

    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      # Optional. If set, it takes precedence over the OAuth token above.
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Empty on scheduled runs, so cron always submits for real.
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}

    steps:
      # ref is set explicitly on purpose. With no ref, checkout takes the SHA
      # that *triggered* the workflow, which for a scheduled run is frozen when
      # the event is created — potentially hours before the job starts, given
      # observed queue delays. That stale tree would not contain a completion
      # marker pushed by a manual run in the meantime, and the session would be
      # submitted twice. Taking the branch tip closes that window.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # The completion marker is briefs/<date>.submit.txt, written only after a
      # real submit. Dry runs don't create it, so they never mask a missed
      # session. To force a re-run, delete that file.
      - name: Already ran today?
        id: ran
        run: |
          D=$(date -u +%Y-%m-%d)
          if [ -f "briefs/${D}.submit.txt" ]; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "Session for ${D} already completed - nothing to do."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "No completed session for ${D} yet - proceeding."
          fi

      # Heartbeat needs nothing but `date`, so it runs before any setup and
      # unconditionally on every non-duplicate trigger, including holidays -
      # that keeps the 60-day inactivity timer from silently disabling the
      # schedule during a quiet stretch, regardless of what the guard below
      # decides.
      - name: Heartbeat
        if: steps.ran.outputs.already == 'false'
        run: |
          mkdir -p state
          date -u +"%Y-%m-%dT%H:%M:%SZ last run" > state/heartbeat.txt

      - uses: actions/setup-python@v5
        if: steps.ran.outputs.already == 'false'
        with:
          python-version: '3.12'

      # Just enough to run desk.py's guard checks below. The rest of
      # requirements.txt (matplotlib etc.) and the npm install are deferred
      # past the guard so a dead trigger (holiday, already ran) never pays
      # for them.
      - name: Install minimal dependencies for guard checks
        if: steps.ran.outputs.already == 'false'
        run: pip install requests

      # Cheap killswitch, deliberately WITHOUT --before-open. Its only job is
      # to stop a holiday or weekend trigger from holding a runner open for
      # hours and installing a toolchain it will never use. The pre-open
      # deadline is a separate question and cannot be answered here - this
      # runs up to three hours before the session actually starts, so any
      # answer it gave would be stale by the time it mattered.
      - name: Is today a trading day?
        id: tradingday
        if: steps.ran.outputs.already == 'false'
        run: |
          if python3 desk.py calendar; then
            echo "trading=true" >> "$GITHUB_OUTPUT"
          else
            echo "trading=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.tradingday.outputs.trading == 'true'
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.tradingday.outputs.trading == 'true'
        run: |
          pip install -r requirements.txt
          npm install -g @anthropic-ai/claude-code
          claude --version

      # The point of the whole exercise. GitHub's trigger time is unreliable,
      # but a job that is already running can wait out the difference, so the
      # session lands at a consistent point relative to the market rather than
      # whenever the scheduler got round to us.
      #
      # 25 minutes before the open, not a fixed wall clock: the open is
      # 13:30 UTC in summer and 14:30 in winter, and is earlier still on
      # half-day sessions. Deriving it from Alpaca's calendar keeps this
      # correct across both daylight-saving regimes without a table of dates.
      # 25 min is chosen so the ~20 min session finishes just before the bell.
      # A trigger that starts later than the target skips the wait entirely.
      - name: Hold open until 25 min before the open
        if: steps.tradingday.outputs.trading == 'true'
        run: python3 desk.py wait --before-open 25

      # The real deadline check, now that we are about to do the work. This is
      # what stops a badly delayed run writing a "pre-market" brief with the
      # market already trading. It has to be here, after the wait, because
      # that is the only point where "how long until the open" is the number
      # that actually governs the session.
      - name: Still inside the pre-market window?
        id: guard
        if: steps.tradingday.outputs.trading == 'true'
        run: |
          if python3 desk.py calendar --before-open 15; then
            echo "trading=true" >> "$GITHUB_OUTPUT"
          else
            echo "trading=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight — auth
        if: steps.guard.outputs.trading == 'true'
        run: |
          echo "claude version: $(claude --version 2>&1 || echo 'NOT INSTALLED')"

          if [ -n "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "CLAUDE_CODE_OAUTH_TOKEN: set, ${#CLAUDE_CODE_OAUTH_TOKEN} chars"
            case "$CLAUDE_CODE_OAUTH_TOKEN" in
              sk-ant-oat*)
                echo "  prefix ok (sk-ant-oat...)" ;;
              sk-ant-api*)
                echo "  WRONG VALUE: that is an API key, not an OAuth token."
                echo "  Put it in the ANTHROPIC_API_KEY secret instead." ;;
              *)
                echo "  WRONG PREFIX: expected sk-ant-oat..., got something else."
                echo "  Re-run 'claude setup-token' and copy only the token line." ;;
            esac
            if printf '%s' "$CLAUDE_CODE_OAUTH_TOKEN" | grep -q '[[:space:]]'; then
              echo "  WARNING: contains whitespace/newline — copy-paste artifact."
            fi
          else
            echo "CLAUDE_CODE_OAUTH_TOKEN: not set"
          fi

          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "ANTHROPIC_API_KEY: set, ${#ANTHROPIC_API_KEY} chars (takes precedence)"
          else
            echo "ANTHROPIC_API_KEY: not set"
          fi

          echo "--- live auth test (1 turn, negligible cost) ---"
          claude -p "Reply with exactly: PREFLIGHT_OK" \
            --max-turns 1 --output-format text

      - name: Run session
        if: steps.guard.outputs.trading == 'true'
        run: bash scripts/session.sh

      - name: Commit results
        if: steps.ran.outputs.already == 'false'
        run: |
          git config user.name  "trading-desk[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A briefs state journal.csv README.md 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "session $(date -u +%Y-%m-%d)"
            # A delayed run may be behind if you pushed meanwhile.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Session summary
        if: always()
        run: |
          {
            echo "## Session $(date -u +%Y-%m-%d)"
            if [ "${{ steps.ran.outputs.already }}" = "true" ]; then
              echo "Already completed earlier today — catch-up run exited without acting."
            elif [ "${{ steps.tradingday.outputs.trading }}" != "true" ]; then
              echo "US market closed - stood down."
            elif [ "${{ steps.guard.outputs.trading }}" != "true" ]; then
              echo "Missed the pre-market deadline - stood down rather than write a"
              echo "post-open brief that would not be comparable with the record."
            else
              echo "### Validation"
              echo '```'
              D=$(date -u +%Y-%m-%d)
              cat "state/dryrun/${D}.check.txt" "briefs/${D}.check.txt" 2>/dev/null \
                || echo "(none)"
              echo '```'
              echo "### Book"
              echo '```'
              cat state/status.txt 2>/dev/null || echo "(none)"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"